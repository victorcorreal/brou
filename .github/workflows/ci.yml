name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Swift regressions, including isolated downloads
        run: python3 Tests/run-ci-tests.py
      - name: Address and popup script regressions
        run: |
          Tests/AddressRegression/run.sh
          node Tests/popup_gesture_script.js
      - name: Package a local build without private profiles
        run: ./build.sh release
      - name: Verify signature
        run: codesign --verify --deep --strict build/Brou.app
